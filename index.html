<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yohei's Life">
<meta name="theme-color" content="#0b1830">
<title>Yohei's Life</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-startup-image" href="splash.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,700;1,800;1,900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ タイトル ============ -->
<section id="title" class="screen on" aria-label="タイトル">
  <img class="poster" id="tPoster" alt="">
  <video id="tVideo" muted playsinline autoplay loop preload="auto"></video>
  <div class="shade"></div>
  <div class="ver">Ver : 0.5.0</div>
  <div class="logo" aria-label="Yohei's Life">
    <svg viewBox="0 0 300 150">
      <defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5BE6FF"/><stop offset=".55" stop-color="#00C8F8"/><stop offset="1" stop-color="#1E9BFF"/></linearGradient></defs>
      <ellipse cx="196" cy="46" rx="58" ry="17" fill="none" stroke="#fff" stroke-width="2.4" transform="rotate(-12 196 46)" stroke-dasharray="290 18" opacity=".95"/>
      <ellipse cx="196" cy="46" rx="48" ry="12" fill="none" stroke="#9CEBFF" stroke-width="1.2" transform="rotate(-12 196 46)" opacity=".8"/>
      <path d="M238 6 L176 142" stroke="#00D4F8" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M218 32 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4z" fill="#fff"/>
      <g transform="skewX(-12)">
        <text x="40" y="58" font-family="Exo 2" font-style="italic" font-weight="800" font-size="30" fill="#fff" stroke="#123a6a" stroke-width="5" paint-order="stroke" letter-spacing="1">Yohei's</text>
        <text x="56" y="128" font-family="Exo 2" font-style="italic" font-weight="900" font-size="76" fill="url(#lg)" stroke="#fff" stroke-width="7" paint-order="stroke" letter-spacing="-1">Life</text>
      </g>
    </svg>
  </div>
  <div class="tbtns">
    <button class="tbtn dark" data-setting>データの設定</button>
  </div>
  <div class="touch"><span>TOUCH TO START</span></div>
  <div class="copy">© Yohei's Life — for Yohei only</div>
  <div class="flash"></div>
</section>

<!-- ============ ローディング ============ -->
<section id="loading" class="screen" aria-label="読み込み中">
  <div class="lt" id="lTip"></div>
  <img id="lImg" alt="">
  <div class="lbar"><i id="lBar"></i></div>
  <div class="lnow">Now Loading…</div>
</section>

<!-- ============ ロビー ============ -->
<section id="lobby" class="screen" aria-label="ロビー">
  <img class="poster" id="lbPoster" alt="">
  <video id="lbVideo" muted playsinline autoplay loop preload="auto"></video>
  <div class="tapzone" id="tapzone" data-tap></div>

  <div class="topbar rise">
    <div class="dt"><span class="num" id="lvDate">11/22</span><small id="lvDay">日</small></div>
    <div class="rs">
      <div class="c pay"><small>給料日</small><span>あと</span><span class="num" id="lvPay">23</span><span>日</span></div>
      <i class="sep"></i>
      <div class="c"><small id="lvBalK">残高</small><span class="num" id="lvBal">¥—</span></div>
      <i class="sep"></i>
      <button class="snd" id="snd" aria-label="音のオン・オフ"></button>
    </div>
  </div>
  <div class="tools rise">
    <button class="chip" id="swap" aria-label="キャラを切り替え">1/2</button>
    <button class="chip" data-expand aria-label="絵だけ表示"><span data-ic="expand" data-s="14" data-w="2.6"></span></button>
  </div>


  <nav class="dock rise" aria-label="メニュー">
    <button data-go="talk"><img src="ic_talk.webp" alt="">トーク</button>
    <button data-go="task"><img src="ic_task.webp" alt="">タスク<span class="badge" id="bTask" hidden></span></button>
    <button data-go="plan"><img src="ic_plan.webp" alt="">予定<span class="badge" id="bPlan" hidden></span></button>
    <button data-go="ledger"><img src="ic_ledger.webp" alt="">台帳<span class="badge" id="bLedger" hidden></span></button>
  </nav>
</section>

<!-- ============ トーク ============ -->
<section id="talk" class="screen wscreen" data-who="both" aria-label="トーク">
  <div class="hdr"><button class="backbtn" data-back aria-label="戻る"><span data-ic="back" data-s="20" data-w="2.8"></span></button>
    <div class="bar"><h1>トーク</h1><span class="sp"></span><button class="ic" data-back data-ic="home" data-s="20" aria-label="ロビー"></button></div></div>
  <div class="slides">
    <div class="sl s1"><img class="wall" alt=""><div class="wall-fade"></div>
      <button class="sum" data-next><i class="en">TALK</i><span id="sum-talk">読み込み中…</span><b>›</b></button></div>
    <div class="sl s2 page"><div class="in" id="box-talk"></div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i></div>
</section>

<!-- ============ タスク ============ -->
<section id="task" class="screen wscreen" data-who="both" aria-label="タスク">
  <div class="hdr"><button class="backbtn" data-back aria-label="戻る"><span data-ic="back" data-s="20" data-w="2.8"></span></button>
    <div class="bar"><h1>タスク</h1><span class="sp"></span><button class="ic" data-back data-ic="home" data-s="20" aria-label="ロビー"></button></div></div>
  <div class="slides">
    <div class="sl s1"><img class="wall" alt=""><div class="wall-fade"></div>
      <button class="sum" data-next><i class="en">TASK</i><span id="sum-task">読み込み中…</span><b>›</b></button></div>
    <div class="sl s2 page"><div class="in" id="box-task"></div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i></div>
</section>

<!-- ============ 予定 ============ -->
<section id="plan" class="screen wscreen" data-who="hoshino" aria-label="予定">
  <div class="hdr"><button class="backbtn" data-back aria-label="戻る"><span data-ic="back" data-s="20" data-w="2.8"></span></button>
    <div class="bar"><h1>予定</h1><span class="sp"></span><button class="ic" data-back data-ic="home" data-s="20" aria-label="ロビー"></button></div></div>
  <div class="slides">
    <div class="sl s1"><img class="wall" alt=""><div class="wall-fade"></div>
      <button class="sum" data-next><i class="en">NEXT</i><span id="sum-plan">読み込み中…</span><b>›</b></button></div>
    <div class="sl s2 page"><div class="in" id="box-plan"></div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i></div>
</section>

<!-- ============ 台帳 ============ -->
<section id="ledger" class="screen wscreen" data-who="mika" aria-label="台帳">
  <div class="hdr"><button class="backbtn" data-back aria-label="戻る"><span data-ic="back" data-s="20" data-w="2.8"></span></button>
    <div class="bar"><h1>台帳</h1><span class="sp"></span><button class="ic" data-back data-ic="home" data-s="20" aria-label="ロビー"></button></div></div>
  <div class="slides">
    <div class="sl s1"><img class="wall" alt=""><div class="wall-fade"></div>
      <button class="sum" data-next><i class="en">LEDGER</i><span id="sum-ledger">読み込み中…</span><b>›</b></button></div>
    <div class="sl s2 page"><div class="in">
    <div class="lselect">
      <div class="lead rise"><img src="av_mika.webp" alt=""><p id="ledLead">おかえり、先生☆ 何を見る？</p></div>
      <div class="selhead rise"><span class="en">Ledger Select</span><small>台帳</small></div>
      <div class="lcards">
        <button class="lcard rise" data-p="money"><img src="card_money.webp" alt=""><span class="lb"><i>MONEY</i><b>お金</b></span><span class="go">›</span>
          <span class="ds">残高・今月の支出・滞納・給料日。Apple Payの記録もここ</span>
          <span class="st" id="stMoney"></span></button>
        <button class="lcard rise" data-p="body"><img src="card_body.webp" alt=""><span class="lb"><i>BODY</i><b>体</b></span><span class="go">›</span>
          <span class="ds">睡眠・お酒・体調の記録。睡眠はヘルスケアから自動</span>
          <span class="st"><span>第2弾で入ります</span></span></button>
        <button class="lcard rise" data-p="people"><img src="card_people.webp" alt=""><span class="lb"><i>PEOPLE</i><b>人</b></span><span class="go">›</span>
          <span class="ds">友達・誕生日・前に会った日。プレゼントの相談もここ</span>
          <span class="st"><span>第2弾で入ります</span></span></button>
        <button class="lcard rise" data-p="vault"><img src="card_vault.webp" alt=""><span class="lb"><i>VAULT</i><b>金庫</b></span><span class="go">›</span>
          <span class="ds">アカウントとパスワード。開くときはロックを解除</span>
          <span class="st"><span>第2弾で入ります</span></span></button>
        <button class="lcard rise" data-p="wall"><img src="card_wall.webp" alt=""><span class="lb"><i>WALLPAPER</i><b>壁紙</b></span><span class="go">›</span>
          <span class="ds">トーク・タスク・予定・台帳の背景。開くたびにランダム</span>
          <span class="st"><span>ホシノ<b class="num" id="wcH2">2枚</b></span><span>ミカ<b class="num" id="wcM2">2枚</b></span></span></button>
      </div>
    </div>
    <div class="ldetail">
      <button class="dback" data-dback>‹ 一覧へ<span class="en" id="dTitle">Money</span></button>
<div class="pane" id="p-money"></div>
    <div class="pane" id="p-body"><div class="lead"><img src="av_hoshino.webp" alt=""><p>ここは第2弾で作るよ〜。もうちょっと待っててね〜</p></div></div>
    <div class="pane" id="p-people"><div class="lead"><img src="av_hoshino.webp" alt=""><p>ここは第2弾で作るよ〜。もうちょっと待っててね〜</p></div></div>
    <div class="pane" id="p-vault"><div class="lead"><img src="av_hoshino.webp" alt=""><p>ここは第2弾で作るよ〜。もうちょっと待っててね〜</p></div></div>
    <div class="pane" id="p-wall">
      <div class="whdr" style="margin-top:0"><img src="av_hoshino.webp" alt="">ホシノの壁紙<small id="wcH"></small></div>
      <div class="wgrid" id="wgH"></div>
      <div class="whdr"><img src="av_mika.webp" alt="">ミカの壁紙<small id="wcM"></small></div>
      <div class="wgrid" id="wgM"></div>
      <p class="more" style="text-align:left;padding:10px 2px">タップで位置を調整。トーク・タスク・予定・台帳を開くたびに、ランダムで出ます</p>
    </div>
    </div>
  </div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i></div>
</section>

<script src="ui.js"></script>
<script src="wall.js"></script>
<script src="sync.js"></script>
<script src="title.js"></script>
</body>
</html>
